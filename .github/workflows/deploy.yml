name: Zero-Downtime Deploy TypeScript App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Dependencies & Build
      run: |
        npm ci
        npm run build

    - name: Organize Deployment Files
      run: |
        mkdir deploy
        cp -r dist/* deploy/
        cp package.json deploy/
        cp package-lock.json deploy/

    # Generate a unique timestamp for this specific release
    - name: Set Release Version
      id: vars
      run: echo "RELEASE_VERSION=$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT

    # Uploads to an isolated folder: /repositories/my-node-app/releases/20261027231800
    - name: Deploy Release to GoDaddy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy/
        server-dir: ./repositories/my-node-app/releases/${{ steps.vars.outputs.RELEASE_VERSION }}/

    # IF AND ONLY IF THE UPLOAD SUCCEEDS: Update the symlink instantly via SSH Key
    - name: Switch Live Symlink (Atomic Switch)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        passphrase: ${{ secrets.SSH_PASSPHRASE }}
        script: |
          cd /home/kiudw9mghth0/repositories/my-node-app
          
          # Install production dependencies inside the new release folder natively
          cd releases/${{ steps.vars.outputs.RELEASE_VERSION }}
          npm install --production
          cd ../..
          
          # Point the 'current' symlink to the brand new release directory
          ln -sfn releases/${{ steps.vars.outputs.RELEASE_VERSION }} current
          
          # Clean up old releases so your disk doesn't fill up (keeps last 5)
          cd releases && ls -t | tail -n +6 | xargs rm -rf
